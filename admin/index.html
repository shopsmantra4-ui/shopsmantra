<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ShopsMantra Admin</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: top bar, tab strip, single working column; product editor opens as a full-height side sheet */
:root{
  --bg:#FAF7F3; --surface:#FFFFFF; --soft:#F3EEE6; --line:#E7DFD3;
  --ink:#1E1426; --muted:#776C7E; --plum:#5B2A86; --plum-soft:#EFE7F6; --gold:#A8843A;
  --ok:#2E7D57; --ok-soft:#E5F3EC; --warn:#A86A12; --warn-soft:#FBF0DD; --bad:#B3261E; --bad-soft:#FBE7E5;
  --f:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:var(--plum)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:120px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}

.top{display:flex;align-items:center;gap:14px;padding-block:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:30px;display:block}
.top .tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;border-left:1px solid var(--line);padding-left:14px}
.top .sp{flex:1}
.top a{color:var(--plum);font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--surface);padding:10px 18px;border-radius:4px;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.pri:hover{background:#4A2070}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px}
label.f{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
textarea.inp{min-height:96px;resize:vertical}
.inp:focus{border-color:var(--plum);outline:none;box-shadow:0 0 0 3px var(--plum-soft)}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
.fld{margin-bottom:16px;min-width:0}
@media (max-width:640px){.row,.row3{grid-template-columns:1fr}}

/* login */
.login{max-width:520px;margin:48px auto 0}
.login h1{font-size:26px;margin-bottom:6px}
.login ol{padding-left:20px;margin:14px 0 20px;color:var(--muted);font-size:14px}
.login ol li{margin-bottom:4px}

/* tabs */
.tabs{display:flex;gap:4px;margin:18px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--plum);border-bottom-color:var(--plum)}
.tab .n{font-size:12px;background:var(--soft);border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--muted)}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .inp{flex:1;min-width:180px}

/* product list */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px 10px 10px}
.item img,.item .noimg{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--soft);display:block}
.item .nm{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.item .acts{display:flex;gap:6px}
.pill{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--muted);font-weight:500}
.pill.new{background:var(--plum-soft);color:var(--plum)}
.pill.chg{background:var(--warn-soft);color:var(--warn)}
.pill.ask{background:var(--ok-soft);color:var(--ok)}
@media (max-width:560px){.item{grid-template-columns:56px 1fr}.item img,.item .noimg{width:56px;height:56px}.item .acts{grid-column:1/-1;justify-content:flex-end}}
.empty{border:1px dashed var(--line);border-radius:8px;padding:30px;text-align:center;color:var(--muted);background:var(--surface)}

/* editor sheet */
.scrim{position:fixed;inset:0;background:rgba(30,20,38,.35);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:50;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(30,20,38,.12);padding-right:env(safe-area-inset-right,0px)}
.sheet header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--surface);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sheet header h2{font-size:19px;flex:1}
.sheet .body{flex:1;overflow:auto;padding:22px}
.sheet footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
.sec{margin-bottom:24px}
.sec h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.chk{display:inline-flex;align-items:center;gap:8px;margin-right:18px;font-size:14px}
.chk input{accent-color:var(--plum);width:17px;height:17px}

.variant{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.vhead{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end;margin-bottom:12px}
.vhead input[type=color]{width:46px;height:42px;padding:3px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--soft);border:1px solid var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .main{position:absolute;left:6px;top:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:#fff;padding:2px 6px;border-radius:3px}
.ph .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(transparent,rgba(30,20,38,.6))}
.ph .ctl button{background:rgba(255,255,255,.92);border:0;border-radius:4px;width:28px;height:26px;font-size:14px;line-height:1;padding:0}
.ph .ctl button.x{color:var(--bad)}
.addph{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;text-align:center;color:var(--plum);font-size:13px;font-weight:500;cursor:pointer;background:var(--surface);padding:8px;max-width:100%}
.addph:hover{border-color:var(--plum);background:var(--plum-soft)}
.addph input{display:none}
.spec{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px}
.err{color:var(--bad);font-size:13px;margin-top:8px}

/* save dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:#fff;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dock .msg{flex:1;min-width:200px;font-size:14px}
.dock .msg b{font-weight:600}
.dock .btn{border-color:#fff;background:transparent;color:#fff}
.dock .btn.pri{background:#fff;color:var(--ink)}
.dock .btn.pri:hover{background:var(--soft)}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:16px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.wait{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status a{color:inherit;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.wait .dot{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.wait .dot{animation:none}}
.stars{color:var(--gold);letter-spacing:2px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;z-index:80;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="../img/logo.svg" alt="ShopsMantra">
    <span class="tag">Admin</span>
    <span class="sp"></span>
    <a href="../" target="_blank" rel="noopener">Open website ↗</a>
    <button class="btn ghost sm" id="pwBtn" hidden>Change password</button>
    <button class="btn ghost sm" id="logout" hidden>Log out</button>
  </div>
  <div id="app"></div>
</div>
<div class="dock" id="dock" hidden><div class="wrap"><div class="msg" id="dockMsg"></div><button class="btn sm" id="discard">Discard</button><button class="btn pri" id="saveAll">Save to website</button></div></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== settings ===== */
const OWNER='shopsmantra4-ui', REPO='shopsmantra', BRANCH='main';
const API='https://api.github.com';
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const GROUPS={clothing:'Clothing',jewellery:'Jewellery',accessories:'Accessories'};

/* ===== state ===== */
let TOKEN=null, cat=null, catSha=null, original='', tab='products', q='';
const newImages={};            // key -> {full:Blob, small:Blob, url:objectURL}
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const slugify=s=>s.toLowerCase().replace(/&/g,' ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
const imgSrc=k=>newImages[k]?newImages[k].url:RAW+'img/s/'+k+'.webp';

/* ===== GitHub API ===== */
async function gh(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+TOKEN,'X-GitHub-Api-Version':'2022-11-28',...(opts.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const err=new Error(m||('GitHub error '+r.status));err.status=r.status;throw err}
  return r.status===204?null:r.json();
}
const b64ToUtf8=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
function utf8ToB64(s){const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
const blobToB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(b)});

async function loadCatalog(){
  const f=await gh(`/repos/${OWNER}/${REPO}/contents/data/catalog.json?ref=${BRANCH}`);
  catSha=f.sha; original=b64ToUtf8(f.content); cat=JSON.parse(original);
  cat.reviews=cat.reviews||[];
}
const dirty=()=>JSON.stringify(cat,null,1)!==JSON.stringify(JSON.parse(original),null,1)||Object.keys(newImages).some(k=>!newImages[k].saved&&used().has(k));
function used(){const s=new Set();cat.products.forEach(p=>(p.variants||[]).forEach(v=>(v.imgs||[]).forEach(k=>s.add(k))));return s}

/* ===== photos: resize in the browser ===== */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('This file is not a photo the browser can open: '+file.name));im.src=u})}
function toWebp(im,max){
  const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>{if(!b||b.type!=='image/webp')rej(new Error('This browser cannot prepare photos. Please use Google Chrome on a computer or Android phone.'));else res(b)},'image/webp',.82));
}
async function addPhotos(files,pid){
  const keys=[];
  for(const f of files){
    const im=await loadImg(f);
    const full=await toWebp(im,1200), small=await toWebp(im,600);
    const key=`p${pid}_${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`;
    newImages[key]={full,small,url:URL.createObjectURL(small)};keys.push(key);
  }
  return keys;
}

/* ===== login: ID + password unlock the GitHub key (kept encrypted in admin/auth.json) ===== */
const AUTH_PATH='admin/auth.json';
const te=new TextEncoder();
const b64=u8=>{let s='';u8.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(id,pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(id.trim().toLowerCase()+'\n'+pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function sealKey(id,pw,token){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=310000;
  const k=await deriveKey(id,pw,salt,iter);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(token)));
  return {v:1,iter,salt:b64(salt),iv:b64(iv),data:b64(ct)};
}
async function openKey(a,id,pw){
  const k=await deriveKey(id,pw,unb64(a.salt),a.iter);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(a.iv)},k,unb64(a.data)));
}
let fetchAuth=async function(){
  for(const u of [RAW+AUTH_PATH,'auth.json']){
    try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.data)return j}}catch(e){}
  }
  return null;
};
async function saveAuth(id,pw){
  const a=await sealKey(id,pw,TOKEN);
  let sha;try{sha=(await gh(`/repos/${OWNER}/${REPO}/contents/${AUTH_PATH}?ref=${BRANCH}`)).sha}catch(e){if(e.status!==404)throw e}
  await gh(`/repos/${OWNER}/${REPO}/contents/${AUTH_PATH}`,{method:'PUT',body:JSON.stringify({message:'Update admin login',content:utf8ToB64(JSON.stringify(a)+'\n'),branch:BRANCH,...(sha?{sha}:{})})});
}
const session={
  get(){try{return sessionStorage.getItem('sm_admin_s')||localStorage.getItem('sm_admin_s')}catch(e){return null}},
  set(t,keep){try{(keep?localStorage:sessionStorage).setItem('sm_admin_s',t)}catch(e){}},
  clear(){try{sessionStorage.removeItem('sm_admin_s');localStorage.removeItem('sm_admin_s');localStorage.removeItem('sm_admin_token')}catch(e){}}
};
function pwProblem(id,pw,pw2){
  if(id.trim().length<3)return'Admin ID must be at least 3 characters.';
  if(pw.length<8)return'Password must be at least 8 characters.';
  if(!/[A-Za-z]/.test(pw)||!/[0-9]/.test(pw))return'Password must have both letters and numbers.';
  if(pw.toLowerCase().includes(id.trim().toLowerCase()))return'Password must not contain the admin ID.';
  if(pw!==pw2)return'The two passwords do not match.';
  return null;
}
const noCrypto=()=>!(window.crypto&&crypto.subtle);
function screen(html){$('#logout').hidden=true;$('#pwBtn').hidden=true;$('#dock').hidden=true;app.innerHTML=html}

function loginView(msg){
  screen(`<div class="login card">
    <h1>Admin login</h1>
    <p class="muted" style="margin:0 0 18px">Sign in with your admin ID and password.</p>
    <form id="lf" autocomplete="on">
      <div class="fld"><label class="f" for="l_id">Admin ID</label><input class="inp" id="l_id" autocomplete="username" required></div>
      <div class="fld"><label class="f" for="l_pw">Password</label><input class="inp" id="l_pw" type="password" autocomplete="current-password" required></div>
      <label class="chk"><input type="checkbox" id="l_keep"> Keep me signed in on this device</label>
      ${msg?`<div class="err">${esc(msg)}</div>`:''}
      <div style="margin-top:18px"><button class="btn pri" type="submit" id="lbtn">Sign in</button></div>
    </form>
    <p class="small muted" style="margin:22px 0 0">Forgot your password? <a href="#" id="toSetup">Reset the login</a> with your GitHub access key.</p>
  </div>`);
  $('#toSetup').onclick=e=>{e.preventDefault();setupView(true)};
  $('#lf').addEventListener('submit',async e=>{
    e.preventDefault();const id=$('#l_id').value,pw=$('#l_pw').value,keep=$('#l_keep').checked;
    $('#lbtn').disabled=true;$('#lbtn').textContent='Checking…';
    const a=await fetchAuth();
    if(!a)return setupView(false);
    try{TOKEN=await openKey(a,id,pw)}catch(err){return loginView('The admin ID or password is wrong.')}
    await start(()=>session.set(TOKEN,keep));
  });
}
function setupView(reset,msg){
  screen(`<div class="login card">
    <h1>${reset?'Reset admin login':'Set up admin login'}</h1>
    <p class="muted" style="margin:0">${reset?'Choose a new admin ID and password.':'Choose the admin ID and password you will use to open this panel.'} This needs your GitHub access key once.</p>
    <ol>
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a></li>
      <li>Repository access: <b>Only select repositories</b> → <b>shopsmantra</b></li>
      <li>Permissions → Repository: <b>Contents: Read and write</b>, <b>Actions: Read-only</b></li>
      <li>Generate token, copy it and paste it below</li>
    </ol>
    <form id="sf" autocomplete="off">
      <div class="fld"><label class="f" for="s_tok">GitHub access key</label><input class="inp" id="s_tok" type="password" placeholder="github_pat_…" required></div>
      <div class="fld"><label class="f" for="s_id">New admin ID</label><input class="inp" id="s_id" autocomplete="username" required></div>
      <div class="row"><div class="fld"><label class="f" for="s_pw">New password</label><input class="inp" id="s_pw" type="password" autocomplete="new-password" required></div>
      <div class="fld"><label class="f" for="s_pw2">Type the password again</label><input class="inp" id="s_pw2" type="password" autocomplete="new-password" required></div></div>
      <div class="hint" style="margin-top:-8px">At least 8 characters, with letters and numbers.</div>
      ${msg?`<div class="err">${esc(msg)}</div>`:''}
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" type="submit" id="sbtn">Save login</button>${reset?'<button class="btn" type="button" id="sBack">Back to sign in</button>':''}</div>
    </form>
  </div>`);
  if(reset)$('#sBack').onclick=()=>loginView();
  $('#sf').addEventListener('submit',async e=>{
    e.preventDefault();
    const tok=$('#s_tok').value.trim(),id=$('#s_id').value,pw=$('#s_pw').value,pw2=$('#s_pw2').value;
    const p=pwProblem(id,pw,pw2);if(p)return setupView(reset,p);
    $('#sbtn').disabled=true;$('#sbtn').textContent='Saving…';
    TOKEN=tok;
    try{await loadCatalog()}catch(err){TOKEN=null;return setupView(reset,err.status===404?'This key cannot see the shopsmantra repository. Check that you picked the shopsmantra repository and gave Contents access.':err.status===401||err.status===403?'This access key was not accepted. Check that you copied all of it and that it has not expired.':err.message)}
    try{await saveAuth(id,pw)}catch(err){TOKEN=null;return setupView(reset,'Could not save the login: '+err.message+'. Make sure the key has Contents: Read and write.')}
    session.set(TOKEN,false);toast('Login saved. Use this ID and password from now on.');
    await start(null);
  });
}
function passwordSheet(msg){
  document.body.style.overflow='hidden';
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="pT" style="width:min(480px,100%)"><header><h2 id="pT">Change admin ID or password</h2><button class="btn ghost sm" id="pX" aria-label="Close">✕</button></header>
  <div class="body"><p class="muted" style="margin-top:0">The old ID and password stop working after you save.</p>
  <div class="fld"><label class="f" for="p_id">Admin ID</label><input class="inp" id="p_id" autocomplete="username"></div>
  <div class="fld"><label class="f" for="p_pw">New password</label><input class="inp" id="p_pw" type="password" autocomplete="new-password"></div>
  <div class="fld"><label class="f" for="p_pw2">Type the password again</label><input class="inp" id="p_pw2" type="password" autocomplete="new-password"></div>
  <div class="hint">At least 8 characters, with letters and numbers.</div>
  ${msg?`<div class="status bad" style="margin-top:14px"><span class="dot"></span>${esc(msg)}</div>`:''}</div>
  <footer><button class="btn" id="pC">Cancel</button><button class="btn pri" id="pOk">Save new login</button></footer></aside>`;
  $('#pX').onclick=$('#pC').onclick=$('#scrim').onclick=closeEditor;
  $('#pOk').onclick=async()=>{const id=$('#p_id').value,pw=$('#p_pw').value,pw2=$('#p_pw2').value;const p=pwProblem(id,pw,pw2);if(p)return passwordSheet(p);
    $('#pOk').disabled=true;$('#pOk').textContent='Saving…';
    try{await saveAuth(id,pw);closeEditor();toast('New login saved.')}catch(e){passwordSheet('Could not save: '+e.message)}};
}
async function start(onOk){
  try{
    await loadCatalog();
    if(onOk)onOk();
    $('#logout').hidden=false;$('#pwBtn').hidden=false;render();checkDeploy();
  }catch(e){
    if(e.status===401||e.status===403||e.status===404){session.clear();TOKEN=null;loginView('Your saved access has stopped working, maybe because the GitHub access key expired. Sign in again, or reset the login with a new key.')}
    else{app.innerHTML=`<div class="card" style="margin-top:20px"><b>Could not load the store data.</b><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`}
  }
}
let deployState=null;
function render(){
  const pc=cat.products.length, rc=cat.reviews.length, cc=cat.categories.length;
  app.innerHTML=`${deployHtml()}
  <div class="tabs" role="tablist">
    <button class="tab ${tab==='products'?'on':''}" data-tab="products">Products<span class="n">${pc}</span></button>
    <button class="tab ${tab==='reviews'?'on':''}" data-tab="reviews">Reviews<span class="n">${rc}</span></button>
    <button class="tab ${tab==='cats'?'on':''}" data-tab="cats">Categories<span class="n">${cc}</span></button>
  </div><div id="pane"></div>`;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  ({products:productsPane,reviews:reviewsPane,cats:catsPane}[tab])();
  updateDock();
}
function updateDock(){
  const d=dirty();$('#dock').hidden=!d;
  if(d){const n=changeCount();$('#dockMsg').innerHTML=`<b>${n} unsaved change${n===1?'':'s'}.</b> Save to publish them on shopsmantra.com.`}
}
function changeCount(){
  const o=JSON.parse(original);let n=0;
  const om=new Map(o.products.map(p=>[p.id,JSON.stringify(p)])), nm=new Map(cat.products.map(p=>[p.id,JSON.stringify(p)]));
  nm.forEach((v,k)=>{if(om.get(k)!==v)n++});om.forEach((v,k)=>{if(!nm.has(k))n++});
  if(JSON.stringify(o.reviews||[])!==JSON.stringify(cat.reviews))n++;
  if(JSON.stringify(o.categories)!==JSON.stringify(cat.categories))n++;
  return Math.max(n,1);
}
function statusOf(p){const o=JSON.parse(original).products.find(x=>x.id===p.id);if(!o)return'new';return JSON.stringify(o)!==JSON.stringify(p)?'chg':''}
const catName=k=>(cat.categories.find(c=>c.key===k)||{}).name||'No category';

function productsPane(){
  const list=cat.products.filter(p=>!q||(p.name+' '+catName(p.cat)).toLowerCase().includes(q.toLowerCase()));
  $('#pane').innerHTML=`<div class="bar"><input class="inp" id="q" type="search" placeholder="Search products" value="${esc(q)}" aria-label="Search products"><button class="btn pri" id="addP">+ Add product</button></div>
  ${list.length?`<div class="list">${list.map(p=>{const k=p.variants&&p.variants[0]&&p.variants[0].imgs[0];const st=statusOf(p);return `<div class="item">
    ${k?`<img src="${imgSrc(k)}" alt="" loading="lazy">`:`<div class="noimg"></div>`}
    <div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="meta"><span>${esc(catName(p.cat))}</span><span>${p.price?inr(p.price)+(p.mrp>p.price?` <s>${inr(p.mrp)}</s>`:''):'<span class="pill ask">Ask price</span>'}</span>${(p.tags||[]).filter(t=>t==='New'||t==='Bestseller').map(t=>`<span class="pill">${t}</span>`).join('')}${st==='new'?'<span class="pill new">Not saved yet</span>':st==='chg'?'<span class="pill chg">Edited</span>':''}</div></div>
    <div class="acts"><button class="btn sm" data-edit="${p.id}">Edit</button><button class="btn sm danger" data-del="${p.id}">Delete</button></div></div>`}).join('')}</div>`
  :`<div class="empty">${q?'No products match your search.':'No products yet. Add your first product.'}</div>`}`;
  $('#q').oninput=e=>{q=e.target.value;const pos=e.target.selectionStart;productsPane();const i=$('#q');i.focus();i.setSelectionRange(pos,pos)};
  $('#addP').onclick=()=>openEditor(null);
  $('#pane').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(+b.dataset.edit));
  $('#pane').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmBox(`Delete “${cat.products.find(p=>p.id===+b.dataset.del).name}”?`,'It will be removed from the website when you save.','Delete',()=>{cat.products=cat.products.filter(p=>p.id!==+b.dataset.del);render()}));
}

/* ===== product editor ===== */
let draft=null, draftIsNew=false;
function openEditor(id){
  draftIsNew=id==null;
  const nid=Math.max(0,...cat.products.map(p=>p.id))+1;
  draft=id==null?{id:nid,name:'',cat:(cat.categories[0]||{}).key||'',price:null,mrp:null,sizes:['Free'],tags:['New'],variants:[{label:'',sw:'#7A2BE8',imgs:[]}],specs:[],desc:''}:structuredClone(cat.products.find(p=>p.id===id));
  draft.specs=draft.specs||[];draft.tags=draft.tags||[];draft.sizes=draft.sizes||[];
  drawEditor();
}
function closeEditor(){$('#sheetRoot').innerHTML='';draft=null;document.body.style.overflow=''}
function drawEditor(err){
  document.body.style.overflow='hidden';
  const d=draft;
  const groups=Object.entries(GROUPS).map(([g,l])=>`<optgroup label="${l}">${cat.categories.filter(c=>c.group===g).map(c=>`<option value="${c.key}" ${d.cat===c.key?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="edT">
  <header><h2 id="edT">${draftIsNew?'Add product':'Edit product'}</h2><button class="btn ghost sm" id="edX" aria-label="Close">✕</button></header>
  <div class="body">
    <div class="sec"><h3>Basic details</h3>
      <div class="fld"><label class="f" for="e_name">Product name</label><input class="inp" id="e_name" value="${esc(d.name)}" placeholder="e.g. Printed Cotton Kurta Set (Blue)"><div class="hint">This also becomes the page link, e.g. shopsmantra.com/products/printed-cotton-kurta-set-blue/</div></div>
      <div class="row3">
        <div class="fld"><label class="f" for="e_cat">Category</label><select class="inp" id="e_cat">${groups}</select></div>
        <div class="fld"><label class="f" for="e_price">Selling price (₹)</label><input class="inp" id="e_price" type="number" min="1" inputmode="numeric" value="${d.price??''}" placeholder="799"></div>
        <div class="fld"><label class="f" for="e_mrp">MRP (₹)</label><input class="inp" id="e_mrp" type="number" min="1" inputmode="numeric" value="${d.mrp??''}" placeholder="1999"></div>
      </div>
      <div class="hint" style="margin:-8px 0 14px">Leave the selling price empty to show “Ask price on WhatsApp” instead of a buy button.</div>
      <div class="fld"><label class="f" for="e_sizes">Sizes</label><input class="inp" id="e_sizes" value="${esc(d.sizes.join(', '))}" placeholder="S, M, L, XL"><div class="hint">Separate with commas. Write <b>Free</b> for free size.</div></div>
      <div class="fld"><span class="f" style="display:block;font-size:13px;font-weight:500;margin-bottom:8px">Labels</span>
        <label class="chk"><input type="checkbox" id="e_new" ${d.tags.includes('New')?'checked':''}> New arrival</label>
        <label class="chk"><input type="checkbox" id="e_best" ${d.tags.includes('Bestseller')?'checked':''}> Bestseller</label></div>
    </div>
    <div class="sec"><h3>Colours & photos</h3>
      <p class="hint" style="margin:-4px 0 12px">The first photo of the first colour is the main photo on the website. Use ← → to change the order.</p>
      <div id="vars">${d.variants.map((v,vi)=>variantHtml(v,vi)).join('')}</div>
      <button class="btn sm" id="addVar">+ Add another colour</button>
    </div>
    <div class="sec"><h3>Description</h3>
      <div class="fld"><label class="f" for="e_desc">About this product</label><textarea class="inp" id="e_desc" placeholder="Fabric, fit, work, occasion…">${esc(d.desc)}</textarea></div>
      <span class="f" style="display:block;font-size:13px;font-weight:500;margin-bottom:8px">Product details table</span>
      <div id="specs">${d.specs.map((s,i)=>`<div class="spec"><input class="inp" data-sk="${i}" value="${esc(s[0])}" placeholder="Fabric" aria-label="Detail name"><input class="inp" data-sv="${i}" value="${esc(s[1])}" placeholder="Pure Cotton" aria-label="Detail value"><button class="btn sm ghost" data-sdel="${i}" aria-label="Remove detail">✕</button></div>`).join('')}</div>
      <button class="btn sm" id="addSpec">+ Add detail</button>
    </div>
    ${err?`<div class="status bad"><span class="dot"></span>${esc(err)}</div>`:''}
  </div>
  <footer><button class="btn" id="edCancel">Cancel</button><button class="btn pri" id="edDone">${draftIsNew?'Add product':'Update product'}</button></footer></aside>`;
  const sync=()=>{
    d.name=$('#e_name').value.trim();d.cat=$('#e_cat').value;
    d.price=$('#e_price').value?Math.round(+$('#e_price').value):null;d.mrp=$('#e_mrp').value?Math.round(+$('#e_mrp').value):null;
    d.sizes=$('#e_sizes').value.split(',').map(s=>s.trim()).filter(Boolean);
    d.tags=[...d.tags.filter(t=>t!=='New'&&t!=='Bestseller'),...($('#e_new').checked?['New']:[]),...($('#e_best').checked?['Bestseller']:[])];
    d.desc=$('#e_desc').value.trim();
    d.variants.forEach((v,vi)=>{v.label=($(`[data-vl="${vi}"]`)||{}).value?.trim()||'';v.sw=($(`[data-vc="${vi}"]`)||{}).value||v.sw});
    d.specs=d.specs.map((s,i)=>{const k=$(`[data-sk="${i}"]`),v=$(`[data-sv="${i}"]`);return k&&v?[k.value.trim(),v.value.trim()]:s});
  };
  const redraw=()=>{const st=$('.sheet .body').scrollTop;drawEditor();$('.sheet .body').scrollTop=st};
  $('#edX').onclick=$('#edCancel').onclick=$('#scrim').onclick=closeEditor;
  $('#addVar').onclick=()=>{sync();d.variants.push({label:'',sw:'#5B2A86',imgs:[]});redraw()};
  $('#addSpec').onclick=()=>{sync();d.specs.push(['','']);redraw()};
  $('.sheet').querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{sync();d.specs.splice(+b.dataset.sdel,1);redraw()});
  $('.sheet').querySelectorAll('[data-vdel]').forEach(b=>b.onclick=()=>{sync();d.variants.splice(+b.dataset.vdel,1);redraw()});
  $('.sheet').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{sync();const [vi,i,dir]=b.dataset.mv.split(',').map(Number);const a=d.variants[vi].imgs;const j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];redraw()});
  $('.sheet').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sync();const [vi,i]=b.dataset.rm.split(',').map(Number);d.variants[vi].imgs.splice(i,1);redraw()});
  $('.sheet').querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{
    sync();const vi=+inp.dataset.up;const files=[...inp.files];if(!files.length)return;
    const lab=inp.closest('label');lab.firstChild.textContent='Preparing photos…';
    try{const keys=await addPhotos(files,d.id);d.variants[vi].imgs.push(...keys);redraw()}catch(e){redraw();drawEditor(e.message)}
  });
  $('#edDone').onclick=()=>{
    sync();
    const e=!d.name?'Please enter the product name.':!d.cat?'Please choose a category.':!d.variants.length||!d.variants[0].imgs.length?'Please add at least one photo.':d.variants.some(v=>!v.imgs.length)?'Every colour needs at least one photo. Remove the colour or add a photo.':(d.price&&d.mrp&&d.mrp<d.price)?'MRP cannot be lower than the selling price.':(!d.price&&d.mrp)?'Please add a selling price, or clear the MRP to show “Ask price on WhatsApp”.':!d.sizes.length?'Please add at least one size (write Free for free size).':null;
    if(e){drawEditor(e);$('.sheet .body').scrollTop=1e6;return}
    d.specs=d.specs.filter(s=>s[0]&&s[1]);
    d.variants.forEach((v,vi)=>{if(!v.label)v.label=d.variants.length>1?'Colour '+(vi+1):'Default'});
    if(!d.mrp&&d.price)d.mrp=d.price;
    const i=cat.products.findIndex(p=>p.id===d.id);
    if(i<0)cat.products.unshift(d);else cat.products[i]=d;
    closeEditor();render();toast(draftIsNew?'Product added. Click “Save to website” to publish.':'Product updated. Click “Save to website” to publish.');
  };
  setTimeout(()=>{if(draftIsNew)$('#e_name').focus()},50);
}
function variantHtml(v,vi){
  return `<div class="variant"><div class="vhead">
    <div><label class="f" for="vl${vi}">Colour name</label><input class="inp" id="vl${vi}" data-vl="${vi}" value="${esc(v.label)}" placeholder="e.g. Maroon"></div>
    <div><label class="f" for="vc${vi}">Swatch</label><input type="color" id="vc${vi}" data-vc="${vi}" value="${esc(v.sw||'#5B2A86')}"></div>
    ${vi>0?`<button class="btn sm danger" data-vdel="${vi}">Remove colour</button>`:'<span></span>'}
  </div>
  <div class="photos">${v.imgs.map((k,i)=>`<div class="ph"><img src="${imgSrc(k)}" alt="Photo ${i+1}">${vi===0&&i===0?'<span class="main">Main</span>':''}
    <div class="ctl"><button type="button" data-mv="${vi},${i},-1" aria-label="Move left">←</button><button type="button" class="x" data-rm="${vi},${i}" aria-label="Remove photo">🗑</button><button type="button" data-mv="${vi},${i},1" aria-label="Move right">→</button></div></div>`).join('')}
    <label class="addph">+ Add photos<input type="file" accept="image/*" multiple data-up="${vi}"></label></div></div>`;
}

/* ===== reviews ===== */
function reviewsPane(){
  $('#pane').innerHTML=`<div class="bar"><span class="muted small" style="flex:1">Add only real reviews from your customers, with their permission.</span><button class="btn pri" id="addR">+ Add review</button></div>
  ${cat.reviews.length?`<div class="list">${cat.reviews.map((r,i)=>`<div class="item" style="grid-template-columns:1fr auto"><div style="min-width:0"><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div style="margin:4px 0">${esc(r.text)}</div><div class="meta"><span>${esc(r.name)}${r.city?', '+esc(r.city):''}</span>${r.product?`<span>${esc(r.product)}</span>`:''}</div></div><div class="acts"><button class="btn sm" data-re="${i}">Edit</button><button class="btn sm danger" data-rd="${i}">Delete</button></div></div>`).join('')}</div>`
  :`<div class="empty">No reviews yet. When a customer sends you a review on WhatsApp, add it here.</div>`}`;
  $('#addR').onclick=()=>reviewForm(-1);
  $('#pane').querySelectorAll('[data-re]').forEach(b=>b.onclick=()=>reviewForm(+b.dataset.re));
  $('#pane').querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>confirmBox('Delete this review?','It will be removed from the website when you save.','Delete',()=>{cat.reviews.splice(+b.dataset.rd,1);render()}));
}
function reviewForm(i,err){
  const r=i>=0?cat.reviews[i]:{name:'',city:'',rating:5,product:'',text:''};
  document.body.style.overflow='hidden';
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="rT"><header><h2 id="rT">${i>=0?'Edit review':'Add review'}</h2><button class="btn ghost sm" id="rX" aria-label="Close">✕</button></header>
  <div class="body"><div class="row"><div class="fld"><label class="f" for="r_name">Customer name</label><input class="inp" id="r_name" value="${esc(r.name)}" placeholder="Priya"></div><div class="fld"><label class="f" for="r_city">City</label><input class="inp" id="r_city" value="${esc(r.city)}" placeholder="Ahmedabad"></div></div>
  <div class="row"><div class="fld"><label class="f" for="r_rating">Rating</label><select class="inp" id="r_rating">${[5,4,3,2,1].map(n=>`<option value="${n}" ${r.rating===n?'selected':''}>${'★'.repeat(n)} (${n})</option>`).join('')}</select></div>
  <div class="fld"><label class="f" for="r_prod">Product</label><select class="inp" id="r_prod"><option value="">Not specific</option>${cat.products.map(p=>`<option ${r.product===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>
  <div class="fld"><label class="f" for="r_text">Review</label><textarea class="inp" id="r_text" placeholder="What the customer said">${esc(r.text)}</textarea></div>
  ${err?`<div class="status bad"><span class="dot"></span>${esc(err)}</div>`:''}</div>
  <footer><button class="btn" id="rC">Cancel</button><button class="btn pri" id="rOk">${i>=0?'Update review':'Add review'}</button></footer></aside>`;
  $('#rX').onclick=$('#rC').onclick=$('#scrim').onclick=closeEditor;
  $('#rOk').onclick=()=>{const n={name:$('#r_name').value.trim(),city:$('#r_city').value.trim(),rating:+$('#r_rating').value,product:$('#r_prod').value,text:$('#r_text').value.trim()};
    if(!n.name||!n.text)return reviewForm(i,'Please enter the customer name and the review.');
    if(i>=0)cat.reviews[i]=n;else cat.reviews.unshift(n);closeEditor();render()};
}

/* ===== categories ===== */
function catsPane(){
  const cnt=k=>cat.products.filter(p=>p.cat===k).length;
  $('#pane').innerHTML=`<div class="bar"><span class="muted small" style="flex:1">Categories appear in the website menu. A category with no products shows “Coming soon”.</span><button class="btn pri" id="addC">+ Add category</button></div>
  ${Object.entries(GROUPS).map(([g,l])=>`<h3 style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px">${l}</h3><div class="list">${cat.categories.filter(c=>c.group===g).map(c=>`<div class="item" style="grid-template-columns:1fr auto"><div><div class="nm">${esc(c.name)}</div><div class="meta"><span>${cnt(c.key)} product${cnt(c.key)===1?'':'s'}</span></div></div><div class="acts"><button class="btn sm" data-cr="${c.key}">Rename</button><button class="btn sm danger" data-cd="${c.key}" ${cnt(c.key)?'disabled title="Move or delete its products first"':''}>Delete</button></div></div>`).join('')||'<div class="empty">No categories</div>'}</div>`).join('')}`;
  $('#addC').onclick=()=>catForm(null);
  $('#pane').querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>catForm(b.dataset.cr));
  $('#pane').querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{if(b.disabled)return;confirmBox('Delete this category?','It will be removed from the website menu when you save.','Delete',()=>{cat.categories=cat.categories.filter(c=>c.key!==b.dataset.cd);render()})});
}
function catForm(key,err){
  const c=key?cat.categories.find(x=>x.key===key):{name:'',group:'clothing'};
  document.body.style.overflow='hidden';
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="cT" style="width:min(480px,100%)"><header><h2 id="cT">${key?'Rename category':'Add category'}</h2><button class="btn ghost sm" id="cX" aria-label="Close">✕</button></header>
  <div class="body"><div class="fld"><label class="f" for="c_name">Category name</label><input class="inp" id="c_name" value="${esc(c.name)}" placeholder="e.g. Sarees"></div>
  <div class="fld"><label class="f" for="c_group">Show under</label><select class="inp" id="c_group">${Object.entries(GROUPS).map(([g,l])=>`<option value="${g}" ${c.group===g?'selected':''}>${l}</option>`).join('')}</select></div>
  ${key?'<div class="hint">Renaming changes the category page link.</div>':''}
  ${err?`<div class="status bad"><span class="dot"></span>${esc(err)}</div>`:''}</div>
  <footer><button class="btn" id="cC">Cancel</button><button class="btn pri" id="cOk">${key?'Update':'Add category'}</button></footer></aside>`;
  $('#cX').onclick=$('#cC').onclick=$('#scrim').onclick=closeEditor;
  $('#cOk').onclick=()=>{const name=$('#c_name').value.trim(),group=$('#c_group').value;
    if(!name)return catForm(key,'Please enter a name.');
    if(cat.categories.some(x=>x.key!==key&&slugify(x.name)===slugify(name)))return catForm(key,'A category with this name already exists.');
    if(['shop','clothing','jewellery','accessories','new-arrivals','under-500'].includes(slugify(name)))return catForm(key,'Please choose a different name; this one is used by the website menu.');
    if(key){c.name=name;c.group=group}else{let k=slugify(name).replace(/-([a-z0-9])/g,(m,x)=>x.toUpperCase())||'cat';while(cat.categories.some(x=>x.key===k))k+='2';cat.categories.push({key:k,name,group})}
    closeEditor();render()};
}

/* ===== confirm ===== */
function confirmBox(title,text,okLabel,fn){
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"></div><div class="card" role="alertdialog" aria-modal="true" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;width:min(420px,calc(100% - 32px))"><h3 style="font-size:18px;margin-bottom:6px">${esc(title)}</h3><p class="muted" style="margin:0 0 18px">${esc(text)}</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" id="cfN">Cancel</button><button class="btn danger" id="cfY">${esc(okLabel)}</button></div></div>`;
  $('#cfN').onclick=$('#scrim').onclick=()=>{$('#sheetRoot').innerHTML=''};
  $('#cfY').onclick=()=>{$('#sheetRoot').innerHTML='';fn()};
}

/* ===== save: one commit with the catalogue and new photos ===== */
async function saveAll(){
  const btn=$('#saveAll');btn.disabled=true;$('#discard').disabled=true;
  const step=t=>{$('#dockMsg').innerHTML=`<b>Saving…</b> ${t}`};
  try{
    step('checking for other changes');
    const cur=await gh(`/repos/${OWNER}/${REPO}/contents/data/catalog.json?ref=${BRANCH}`);
    if(cur.sha!==catSha)throw new Error('The store data was changed somewhere else since you opened this page. Copy your changes, reload the page and try again.');
    const ref=await gh(`/repos/${OWNER}/${REPO}/git/ref/heads/${BRANCH}`);
    const head=await gh(`/repos/${OWNER}/${REPO}/git/commits/${ref.object.sha}`);
    const u=used();const tree=[];const keys=Object.keys(newImages).filter(k=>u.has(k)&&!newImages[k].saved);
    let i=0;
    for(const k of keys){
      step(`uploading photo ${++i} of ${keys.length}`);
      for(const [sub,blob] of [['',newImages[k].full],['s/',newImages[k].small]]){
        const b=await gh(`/repos/${OWNER}/${REPO}/git/blobs`,{method:'POST',body:JSON.stringify({content:await blobToB64(blob),encoding:'base64'})});
        tree.push({path:`img/${sub}${k}.webp`,mode:'100644',type:'blob',sha:b.sha});
      }
    }
    step('saving product details');
    const json=JSON.stringify(cat,null,1)+'\n';
    const jb=await gh(`/repos/${OWNER}/${REPO}/git/blobs`,{method:'POST',body:JSON.stringify({content:utf8ToB64(json),encoding:'base64'})});
    tree.push({path:'data/catalog.json',mode:'100644',type:'blob',sha:jb.sha});
    const t=await gh(`/repos/${OWNER}/${REPO}/git/trees`,{method:'POST',body:JSON.stringify({base_tree:head.tree.sha,tree})});
    const c=await gh(`/repos/${OWNER}/${REPO}/git/commits`,{method:'POST',body:JSON.stringify({message:'Update store from admin panel',tree:t.sha,parents:[ref.object.sha]})});
    await gh(`/repos/${OWNER}/${REPO}/git/refs/heads/${BRANCH}`,{method:'PATCH',body:JSON.stringify({sha:c.sha})});
    original=json;catSha=jb.sha;keys.forEach(k=>{newImages[k].saved=true});
    deployState={state:'wait',sha:c.sha,since:Date.now()};
    toast('Saved. The website is updating.');render();checkDeploy();
  }catch(e){
    $('#dockMsg').innerHTML=`<b style="color:#FFB4AB">Not saved.</b> ${esc(e.message)}`;
  }finally{btn.disabled=false;$('#discard').disabled=false}
}
function deployHtml(){
  if(!deployState)return'';
  const runs=`https://github.com/${OWNER}/${REPO}/actions`;
  if(deployState.state==='wait')return `<div class="status wait" style="margin-top:18px"><span class="dot"></span><span>Publishing your changes. The website updates in about 2–3 minutes. <a href="${runs}" target="_blank" rel="noopener">See progress</a></span></div>`;
  if(deployState.state==='ok')return `<div class="status ok" style="margin-top:18px"><span class="dot"></span><span>Your changes are live on <a href="https://www.shopsmantra.com/" target="_blank" rel="noopener">shopsmantra.com</a>. Refresh the website to see them.</span></div>`;
  if(deployState.state==='bad')return `<div class="status bad" style="margin-top:18px"><span class="dot"></span><span>Your changes were saved, but publishing failed. <a href="${runs}" target="_blank" rel="noopener">Open the error</a> and send a screenshot to your developer.</span></div>`;
  return '';
}
async function checkDeploy(){
  clearTimeout(checkDeploy.t);
  try{
    const r=await gh(`/repos/${OWNER}/${REPO}/actions/runs?branch=${BRANCH}&per_page=1`);
    const run=r.workflow_runs&&r.workflow_runs[0];
    if(!run){if(deployState&&deployState.state==='wait')checkDeploy.t=setTimeout(checkDeploy,8000);return}
    const prev=deployState&&deployState.state;
    if(run.status!=='completed')deployState={state:'wait'};
    else if(deployState&&deployState.sha&&run.head_sha!==deployState.sha)deployState.state='wait';
    else deployState={state:run.conclusion==='success'?'ok':'bad'};
    if(!prev&&deployState.state==='ok')deployState=null; // nothing to report on first load
    if(prev!==(deployState&&deployState.state)&&!$('.sheet'))render();
    if(deployState&&deployState.state==='wait')checkDeploy.t=setTimeout(checkDeploy,8000);
  }catch(e){ /* key has no Actions permission: keep the simple message */ }
}

/* ===== boot ===== */
$('#saveAll').onclick=saveAll;
$('#discard').onclick=()=>confirmBox('Discard all unsaved changes?','Your edits since the last save will be lost.','Discard',()=>{cat=JSON.parse(original);render()});
$('#logout').onclick=()=>confirmBox('Log out of the admin panel?','You will need your admin ID and password to sign in again.','Log out',()=>{session.clear();location.reload()});
$('#pwBtn').onclick=()=>passwordSheet();
window.addEventListener('beforeunload',e=>{if(cat&&dirty()){e.preventDefault();e.returnValue=''}});
if(noCrypto()){screen('<div class="login card"><h1>Open this page with https</h1><p class="muted">For security the admin panel only works on <b>https://www.shopsmantra.com/admin/</b>. Turn on “Enforce HTTPS” in GitHub Pages settings, then open the https link.</p></div>')}
else{TOKEN=session.get();if(TOKEN){app.innerHTML='<p class="muted" style="margin-top:30px">Loading your store…</p>';start(null)}else loginView()}
</script>
</body>
</html>
